<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>D.E.R.B.Y. — HS競馬予想システム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
/* 配置の考え方：発走順の時刻表を背骨にする。スマホは 時刻表 → 鞍 → 馬 の3層、PCは時刻表を左に固定して鞍を右に開く。
   面は平らな帳票（罫線で区切る）。色は意味にだけ使う：芝=緑・ダート=茶・見込みより高い=青・低い=赤・調教A=金。 */
:root{
  --bg:#eceee9; --surface:#ffffff; --surface2:#f5f6f2; --ink:#17211c; --ink2:#46524c; --mute:#75807a;
  --line:#e0e4dd; --line2:#c6cdc5; --turf:#0d5c3d; --turf-weak:#e2efe7; --on-turf:#ffffff; --dirt:#8a5827;
  --hot:#bf341c; --hot-weak:#fbe8e3; --cool:#2a5fae; --cool-weak:#e5edf9; --gold:#8f6400; --gold-weak:#faefcf;
  --w1:#ffffff; --w1b:#9aa39c;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --num:"Barlow Semi Condensed","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --barh:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#161c19; --surface2:#1d2521; --ink:#e8ede9; --ink2:#b9c3bc; --mute:#87928b;
  --line:#28312c; --line2:#3b4740; --turf:#5bc496; --turf-weak:#163226; --on-turf:#06130d; --dirt:#d3a36c;
  --hot:#ff8d74; --hot-weak:#3a1c15; --cool:#8db6f3; --cool-weak:#172741; --gold:#e4b74d; --gold-weak:#372e0e;
  --w1:#f4f5f3; --w1b:#f4f5f3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161c19; --surface2:#1d2521; --ink:#e8ede9; --ink2:#b9c3bc; --mute:#87928b;
  --line:#28312c; --line2:#3b4740; --turf:#5bc496; --turf-weak:#163226; --on-turf:#06130d; --dirt:#d3a36c;
  --hot:#ff8d74; --hot-weak:#3a1c15; --cool:#8db6f3; --cool-weak:#172741; --gold:#e4b74d; --gold-weak:#372e0e;
  --w1:#f4f5f3; --w1b:#f4f5f3; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}


/* 骨格 */
.shell{display:block}
.pane{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line2)}
.toprow{display:flex;align-items:center;gap:10px;min-height:48px}
.brand{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.14em}
.brand i{font-style:normal;color:var(--turf)}
.day{font-size:12px;color:var(--ink2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.day b{font-family:var(--num);font-size:15px;color:var(--ink);margin-right:6px}
.fresh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);white-space:nowrap}
.fresh button{height:32px;padding:0 11px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;font-size:12px;font-weight:700}
.back{border:0;background:none;height:36px;padding:0 6px 0 0;font-weight:700;font-size:13px;color:var(--turf);display:flex;align-items:center;gap:2px}
body.navbottom .back{display:none}
.tabs{display:flex;gap:0;border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;height:42px;font-size:13.5px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--turf)}
.tabs button small{font-family:var(--num);font-size:12px;margin-left:3px;color:var(--turf)}

/* 下の操作帯（スマホ） */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom,0px);display:none}
.barrow{display:flex;align-items:stretch;gap:6px;height:var(--barh);padding-block:7px}
.bar .nav{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;font-weight:700;color:var(--mute);border-radius:6px}
.bar .nav b{font-family:var(--num);font-size:17px;line-height:1;color:inherit}
.bar .nav.on{color:var(--turf);background:var(--turf-weak)}
.bar .list{flex:0 0 58px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;font-size:12px;font-weight:700}
.bar .stp{flex:1;border:1px solid var(--line2);background:var(--surface);border-radius:6px;font-size:12.5px;font-weight:700;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-width:0}
.bar .stp i{font-style:normal;font-family:var(--num);font-size:11px;color:var(--mute)}
.bar .stp.on{background:var(--turf);border-color:var(--turf);color:var(--on-turf)}
.bar .stp.on i{color:var(--on-turf)}
.bar .stp.dn i{color:var(--turf)}
body.navbottom .bar{display:block}
body.navbottom .pad{padding-bottom:calc(var(--barh) + 24px + env(safe-area-inset-bottom,0px))}
body.navbottom .top .hometabs, body.navbottom .top .steps{display:none}
.pad{padding-bottom:40px}

/* 共通の部品 */
.sec{font-size:11.5px;font-weight:700;color:var(--mute);letter-spacing:.06em;padding-block:16px 6px;display:flex;align-items:baseline;gap:2px 8px;flex-wrap:wrap;white-space:nowrap}
.sec>span{font-weight:500;letter-spacing:0;white-space:normal;min-width:0}
.sheetp{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.note{font-size:11.5px;color:var(--mute);line-height:1.6;padding-block:8px}
.wk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 3px;border-radius:3px;
  font-family:var(--num);font-weight:700;font-size:14px;line-height:1;flex:0 0 auto}
.wk.s{min-width:19px;height:19px;font-size:12.5px}
.w1{background:var(--w1);color:#17211c;box-shadow:inset 0 0 0 1px var(--w1b)} .w2{background:#1b1b1b;color:#fff;box-shadow:inset 0 0 0 1px #555}
.w3{background:#d8322c;color:#fff} .w4{background:#1f5fc0;color:#fff} .w5{background:#f2cc1d;color:#17211c}
.w6{background:#1f8f4c;color:#fff} .w7{background:#ee7d1a;color:#17211c} .w8{background:#f29bb8;color:#17211c}
.tag{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:3px;font-size:11.5px;font-weight:700;
  background:var(--surface2);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.tag.gold{background:var(--gold-weak);color:var(--gold);box-shadow:none}
.tag.turf{background:var(--turf-weak);color:var(--turf);box-shadow:none}
.tag.hot{background:var(--hot-weak);color:var(--hot);box-shadow:none}
.tag.cool{background:var(--cool-weak);color:var(--cool);box-shadow:none}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.shiba{color:var(--turf);font-weight:700}.dirt{color:var(--dirt);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip b{font-family:var(--num);font-size:13.5px;margin-left:4px;color:var(--turf)}
.chiplab{flex:0 0 auto;align-self:center;font-size:11px;font-weight:700;color:var(--mute);margin-right:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)} .chip.on b{color:var(--bg)}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:40px;border:0;border-left:1px solid var(--line2);background:none;font-size:13px;font-weight:700;color:var(--ink2);padding:0 6px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.ai{background:var(--turf-weak);color:var(--turf)}
.seg button.me{background:var(--ink);color:var(--bg)}
.cta{display:block;width:100%;min-height:50px;border:0;border-radius:6px;background:var(--turf);color:var(--on-turf);font-size:15px;font-weight:700;margin-block:18px 4px}
.cta.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}

/* ホーム：時刻表 */
.prevline{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface2);text-align:left;min-height:44px;font-size:12.5px;color:var(--ink2)}
.prevline b{color:var(--ink)} .prevline .go{margin-left:auto;color:var(--turf);font-weight:700;white-space:nowrap}
.pastbtn{display:flex;width:100%;border:0;background:none;min-height:44px;align-items:center;font-size:12.5px;font-weight:700;color:var(--mute);gap:8px}
.pastbtn span{margin-left:auto;color:var(--turf)}
.nowline{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--hot);padding-block:6px}
.nowline::after{content:"";flex:1;height:1px;background:var(--hot)}
.rw{display:grid;grid-template-columns:58px minmax(0,1fr) 44px;gap:0 8px;align-items:start;border-top:1px solid var(--line);padding-block:11px;cursor:pointer}
.rw:first-child{border-top:0}
.rw.past{opacity:.55}
.rw.sel{background:var(--turf-weak)}
.rw .t b{display:block;font-family:var(--num);font-weight:700;font-size:21px;line-height:1.1}
.rw .t small{display:block;font-size:11px;color:var(--mute);font-weight:700;margin-top:2px;line-height:1.35}
.rw .t small span{display:inline-block;white-space:nowrap}
.rw .t small.soon{color:var(--hot)}
.rw .h{display:flex;gap:8px;align-items:baseline;min-width:0}
.rw .h .pl{font-weight:700;font-size:15px;white-space:nowrap}
.rw .h .pl .n{font-size:17px}
.rw .h .nm{font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rw .c{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.rw .hs1{display:flex;gap:5px;align-items:center;min-width:0;font-size:12.5px;color:var(--ink2);margin-top:3px;white-space:nowrap}
.rw .hs1 em{font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink)}
.rw .hs1 i{font-style:normal;font-size:11px;color:var(--mute);font-weight:700}
.rw .tags{margin-top:6px}
.rw .ck{font-size:12px;color:var(--ink2);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.star{width:44px;height:44px;border:0;background:none;font-size:20px;color:var(--line2);margin-top:-8px;line-height:1}
.star.on{color:var(--gold)}

/* 鞍の見出し */
.rhead{background:var(--surface);padding-block:12px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.rhead h1{margin:0;font-size:19px;font-weight:700;line-height:1.25;text-wrap:balance}
.rhead h1 .n{font-size:23px;margin-right:6px}
.rhead .meta{grid-column:1;font-size:12.5px;color:var(--ink2);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.rhead .meta .n{font-size:15px;color:var(--ink);font-weight:600}
.cd{font-family:var(--num);font-weight:700;font-size:13px;padding:1px 7px;border-radius:3px;background:var(--surface2);color:var(--ink2)}
.cd.soon{background:var(--hot-weak);color:var(--hot)}
.steps{display:flex;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.steps button{flex:1;height:36px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.steps button i{font-style:normal;font-family:var(--num);margin-right:4px;color:var(--mute)}
.steps button.on{background:var(--turf);border-color:var(--turf);color:var(--on-turf)} .steps button.on i{color:var(--on-turf)}

/* レースのステップ */
.verdict{font-size:17px;font-weight:700;line-height:1.45;padding-block:16px 4px;word-break:auto-phrase}
.mt{display:grid;grid-template-columns:118px minmax(0,1fr) 78px;gap:10px;align-items:center;min-height:30px;font-size:12.5px}
.mt .trk{position:relative;height:8px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.mt .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--turf)}
.mt .trk u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.mt .v{text-align:right;white-space:nowrap}
.mt .v b{font-family:var(--num);font-size:16px}.mt .v small{color:var(--mute);font-size:11px;margin-left:4px}
.stk{grid-column:2/4;display:block;padding-block:7px}
.stk .sb{display:flex;gap:2px;height:8px}
.stk .sb i{display:block;min-width:4px;background:var(--line2)}
.stk .sb i.top{background:var(--turf)}
.stk .sl{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.stk .sl b{font-weight:500}.stk .sl b.top{font-weight:700;color:var(--turf)}
.kz{font-size:13px;line-height:1.75;color:var(--ink2)}
.kz p{margin:0 0 8px;max-width:38em}
.fold{border-top:1px solid var(--line)}
.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:46px;cursor:pointer;font-weight:700;font-size:13.5px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .sm{font-weight:500;font-size:12px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fold>summary::after{content:"開く";font-size:12px;color:var(--turf);font-weight:700;margin-left:auto;white-space:nowrap}
.fold[open]>summary::after{content:"閉じる"}
.ax{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 10px;align-items:center;padding-block:6px}
.ax .l{font-size:12.5px;font-weight:700}
.ax .w{grid-column:2;font-size:11px;color:var(--mute)}
.trt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding-block:7px;border-top:1px solid var(--line);font-size:12.5px}
.trt:first-of-type{border-top:0}
.trt .x{font-family:var(--num);font-weight:700;font-size:14px}
.trt .ns{grid-column:1/-1;display:flex;gap:3px;flex-wrap:wrap}
.up{color:var(--cool)}.dn{color:var(--hot)}

/* 馬のステップ */
.hh{display:grid;grid-template-columns:26px minmax(0,1fr) 26px 26px 26px 90px;gap:0 4px;align-items:center}
.hh.hd{font-size:10.5px;color:var(--mute);font-weight:700;padding-block:8px 4px;text-align:center;position:sticky;z-index:5;background:var(--surface);top:calc(env(safe-area-inset-top,0px) + var(--rtop,0px))}
.hh.hd span:nth-child(2){text-align:left}
.lane{font-size:12px;font-weight:700;padding-block:7px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line2);background:var(--surface2)}
.lane .n{font-size:14px}
.lane.k{color:var(--turf)}.lane.x{color:var(--mute)}
.hr{border-top:1px solid var(--line);padding-block:9px}
.hr.dim .nm,.hr.dim .rk{opacity:.55}
.hr .nm{min-width:0;cursor:pointer}
.hr .nm b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .nm small{font-size:11.5px;color:var(--mute)}
.rk{font-family:var(--num);font-size:16px;text-align:center;color:var(--mute);font-weight:500}
.rk.t{color:var(--ink);font-weight:700}
.kc{display:flex;gap:4px}
.kc button{flex:1;height:40px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);font-size:12.5px;font-weight:700;color:var(--mute)}
.kc button.k{background:var(--turf);border-color:var(--turf);color:var(--on-turf)}
.kc button.x{background:var(--ink2);border-color:var(--ink2);color:var(--bg)}
.hr .tags{grid-column:2/-1;margin-top:6px}
.hr .kzh{grid-column:2/-1;font-size:12px;color:var(--ink2);line-height:1.6;margin-top:5px}

/* 騎手 */
.jr{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:6px 10px;align-items:center;border-top:1px solid var(--line);padding-block:11px}
.jr .who{display:flex;gap:6px;align-items:center;min-width:0;font-weight:700;white-space:nowrap}
.jr .who span.jn{flex:0 0 auto}
.jr .who small{font-weight:500;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv{position:relative;height:8px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.dv u{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.dv i{position:absolute;top:0;bottom:0}
.dv i.p{background:var(--cool)}.dv i.m{background:var(--hot)}
.jr .s{font-size:11.5px;color:var(--ink2);margin-top:4px}
.jr .seg button{min-height:40px;font-size:12.5px;padding:0 2px}
.jr .seg button.j{background:var(--turf);color:var(--on-turf)}
.jr .seg button.a{background:var(--turf-weak);color:var(--turf)}
.jr .seg button.o{background:var(--surface2);color:var(--mute)}

/* 買い方 */
.kh{font-size:12px;font-weight:700;color:var(--mute);padding-block:12px 4px;border-top:1px solid var(--line2);display:flex;gap:8px}
.cb{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-block:8px}
.cb.off .g{opacity:.45}
.ck2{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.ck2 i{width:24px;height:24px;border-radius:4px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:15px;color:transparent}
.ck2.on i{background:var(--turf);border-color:var(--turf);color:var(--on-turf)}
.cb .g .u{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.cb .g .u em{font-style:normal;font-family:var(--num);font-weight:700;font-size:15px;margin-left:6px}
.cb .g .s{font-size:11.5px;color:var(--ink2);margin-top:3px}
.cb .g .s.tg{color:var(--hot);font-weight:700}
.amt{display:flex;align-items:center;gap:2px}
.amt button{width:44px;height:44px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);font-size:19px;font-weight:700}
.amt b{font-family:var(--num);font-size:17px;min-width:50px;text-align:right;padding-right:4px}
.tot{position:sticky;bottom:calc(var(--barh) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:6px;padding:10px 14px;display:flex;gap:4px 16px;flex-wrap:wrap;align-items:baseline;margin-top:14px;font-size:12.5px}
.tot b{font-family:var(--num);font-size:19px;margin:0 2px 0 4px}
.tot .w{font-weight:700}

function tjNums(){ if(!tjOn()) return null; const ok=new Set((PACK.horses||[]).map(h=>h.num)), seen=new Set(), f=xs=>(xs||[]).map(x=>x.num).filter(n=>ok.has(n)&&!seen.has(n)&&seen.add(n));

/* 振り分け＝点数（−HS順位＋理由の重み＋展開予想の差分）の上位K頭を残す。当日の読みが出ている鞍は、その軸と相手を残す。人の直しが最優先 */
function groups(){

  const sc=h=>{ const b=F.by[h.num]||F.by[String(h.num)]||{}; return (b.score||-(h.hsr||99))+tkAdj(h); };

function roles(){

  if(s.role){ const r={jiku:s.role.jiku.filter(n=>keep.includes(n)), aite:s.role.aite.filter(n=>keep.includes(n))};

function combosV6(){
  const {jiku:J, aite:A}=roles(), H=PACK.horses||[], odd=n=>(H.find(h=>h.num===n)||{}).odds, out=[];
  J.forEach(n=>out.push({key:`t${n}`, ken:"単勝", lab:`単勝 ${n}`, uma:[n], o:odd(n)}));
  const pairs=[]; if(J.length===2) pairs.push([J[0],J[1]]); J.forEach(j=>A.forEach(a=>pairs.push([j,a])));
  if(!J.length) for(let i=0;i<A.length;i++)for(let k=i+1;k<A.length;k++) pairs.push([A[i],A[k]]);   /* 軸なし＝相手どうしのボックス */
  pairs.forEach(([a,b])=>out.push({key:`u${a}-${b}`, ken:"馬連", lab:`馬連 ${a}-${b}`, uma:[a,b], o:umOdds(a,b)}));
  const tri=[];
  if(J.length===2) A.forEach(a=>tri.push([J[0],J[1],a]));

  tri.forEach(t=>out.push({key:`s${t.join("-")}`, ken:"3連複", lab:`3連複 ${t.join("-")}`, uma:t, o:sfOdds(...t)}));

}
const R100=x=>Math.max(100,Math.round(x/100)*100);
/* AIの組み方＝オッズ盤の事実だけ。優先＝馬連→3連複→単勝。Σ1/オッズ が0.85以下の範囲で足し、金額は 1÷オッズ に比例して配る */
function aiPlan(C,budget){
  const order=[...C.filter(c=>c.ken==="馬連"),...C.filter(c=>c.ken==="3連複"),...C.filter(c=>c.ken==="単勝")].filter(c=>c.o!=null&&c.o>1);
  const on=[]; let inv=0;
  for(const c of order){ if(inv+1/c.o<=0.85){ on.push(c.key); inv+=1/c.o; } }
  const amt={}; const sum=on.reduce((s,k)=>s+1/C.find(c=>c.key===k).o,0);
  on.forEach(k=>{ const c=C.find(x=>x.key===k); amt[k]=R100(budget*(1/c.o)/sum); });
  const why=[];
  C.forEach(c=>{ if(c.o==null) why.push(`${c.lab}はオッズ未取得`);
    else if(!on.includes(c.key)) why.push(`${c.lab}（${c.o}倍）は足すと払戻が投資を割りやすいので外す`); });
  return {on, amt, why};
}
function plan(){
  const s=st(), C=combosV6(), ai=aiPlan(C,s.budget||1000);
  const amt=s.amt||ai.amt, on=C.filter(c=>s.amt?(amt[c.key]>0&&!s.off[c.key]):ai.on.includes(c.key)).map(c=>c.key);
  return {C, ai, amt, on};
}

    R.metrics.forEach(x=>h.push(meter(x.label,x.v,x.base)));
    const ss=R.style_share||{}, ks=["逃げ","先行","差し","追込"].filter(k=>ss[k]), mx=[...ks].sort((a,b)=>ss[b]-ss[a])[0];
    if(ks.length) h.push(`<div class="mt"><span>1着の脚質</span><span class="stk"><span class="sb">${ks.map(k=>`<i class="${k===mx?"top":""}" style="flex:${ss[k]}"></i>`).join("")}</span><span class="sl">${ks.map(k=>`<b class="${k===mx?"top":""}">${k} <span class="n">${ss[k]}</span>%</b>`).join("")}</span></span></div>`);

      `<div class="trt"><span>${esc(t.label)}</span><span class="x ${t.d>0?"up":"dn"}">${t.d>0?"高い":"低い"} ${(+t.ratio).toFixed(2)}倍</span>
       <span class="ns">${(t.nums||[]).map(n=>wk(n,PACK.heads,true,HN(n).waku)).join("")}</span></div>`).join("")}
      <div class="note">${R.fuda?`札の表は ${esc(R.fuda.made)} に作成（毎週の前日作業で作り直す）。調べた期間 ${esc(R.fuda.period)}。調べた ${esc(R.fuda.tested)} 区分のうち、ずれが5%以上で、偶然で起きる幅の3倍を超えた ${esc(R.fuda.n_items)} 枚だけを使う。馬の並びには、1.15倍のずれをHSの1順位ぶんとして効かせる（ずれは8割に縮めて使う。1頭の合計は2順位まで）。`:"2023-2025で1.0から離れ、2026も同じ向きだったもの"}</div>`);
  }

/* 当日の読み（V7.4.0・p2 の tj_<raceId>.json。Mac側の定点ティックが発走45〜105分前に作る。無い鞍は何も出さない） */
function tjHtml(){
  if(!TJ||TJ.race_id!==PACK.race_id) return "";
  const nm=n=>{ const x=(PACK.horses||[]).find(z=>z.num===n)||{}; return `${wk(n,PACK.heads,true,x.waku)} <b>${esc(x.name||"")}</b>`; };
  const v2=tjOn(), PM={}; (TJ.pos||[]).forEach(x=>{ PM[x.num]=x; });
  const ps=n=>{ const q=PM[n]; return q?` <span class="tag">${esc(q.p)}${q.kawari&&q.kawari!=="なし"?`・いつもより${esc(q.kawari)}`:""}</span>`:""; };
  const kwy=n=>{ const q=PM[n]; return v2&&q&&q.kawari&&q.kawari!=="なし"&&q.why?`<br>いつもより${esc(q.kawari)}の位置と読む理由：${esc(q.why)}`:""; };
  const li=(xs)=>(xs||[]).map(x=>`<div class="tjr">${nm(x.num)}${v2?ps(x.num):""}<small>${esc(x.why||"")}${kwy(x.num)}${x.zure?`<br>決まる位置と違う位置の馬を軸にする理由：${esc(x.zure)}`:""}</small></div>`).join("");
  const at=String(TJ.generated_at||"").slice(11,16);
  const byp=p=>(TJ.pos||[]).filter(x=>x.p===p).map(x=>`${x.num}`).join("・");
  const kw=(TJ.pos||[]).filter(x=>x.kawari&&x.kawari!=="なし");
  const JK=new Set((TJ.jiku||[]).map(x=>x.num)), AT=new Set((TJ.aite||[]).map(x=>x.num));
  const kimaru=p=>({"前残り":["逃げ","好位"],"好位":["逃げ","好位"],"差し":["中団","後方"],"追込":["中団","後方"]}[TJ.ichi]||[]).includes(p);
  const tai=p=>(TJ.pos||[]).filter(x=>x.p===p).sort((a,b)=>(a.c4||99)-(b.c4||99)).map(x=>{ const h=(PACK.horses||[]).find(z=>z.num===x.num)||{};
    return `<span class="tjh${JK.has(x.num)?" jk":AT.has(x.num)?" at":""}">${wk(x.num,PACK.heads,true,h.waku)}${esc(String(h.name||"").slice(0,5))}${x.kawari==="前"?"↑":x.kawari==="後ろ"?"↓":""}</span>`; }).join("");
  const hs1=(PACK.horses||[]).find(z=>z.hsr===1), T=tjNums();
  const posBlock=v2?taiBox(TJ,JK,AT,"各馬の今日の位置"):"";
  return `<div class="aibox tj"><b>当日の読み</b><span class="sm"> ${esc(at)} 時点・当日のオッズ・馬体重・今日の決まり方を見て作成</span>
    <p>${esc(TJ.suji||"")}</p>${posBlock}
    <div class="sec">軸の候補</div>${li(TJ.jiku)}
    <div class="sec">相手</div>${li(TJ.aite)}
    ${(TJ.abunai||[]).length?`<div class="sec">人気だが危ない</div>${li(TJ.abunai)}`:""}
    ${(TJ.hiroeru||[]).length?`<div class="sec">人気は無いが拾える</div>${li(TJ.hiroeru)}`:""}
    ${v2?kawariFold(TJ,new Set([TJ.jiku,TJ.aite,TJ.abunai,TJ.hiroeru].flatMap(xs=>(xs||[]).map(x=>x.num)))):""}
    <div class="sec">想定が崩れる条件</div><p>${esc(TJ.kuzure||"")}</p>
    <small>${v2?`「馬」の段の「残す」と、軸・相手の初期の形は、この読みから取っている（人が直せばそちらが先）。${hs1&&T&&!T.all.includes(hs1.num)?`HS1位の${hs1.num}番は、この読みの軸にも相手にも入っていない（「馬」の段では保留の先頭に並ぶ）。`:""}`
      :"文章で作った読み。「馬」の段の並び（HS順位＋展開の合い方）とは別に作っているので、食い違う時は両方を見て決める。"}</small></div>`;

/* コースの特性（独自のコースデータ＝01_model/course_db.json の stats。走った後の事実） */

/* 今の読み（人が変えた軸があればそれ、無ければAIの読み）に対して、その馬の近5走から拾える事実を返す。
   引き継ぎ 3.5章＝「人の読みを入れると、それに合う候補と根拠が返る」順番のための材料。事実だけで、点には入れない */
function curYomi(){ const s=st(), R=((PACK.flow||{}).race)||{}, ai=R.tenkai||{}, o={};
  TK_AXES.forEach(([ax])=>{ o[ax]=s.tk[ax]||ai[ax]; });
  if(!s.tk["決まる位置"]&&TK_SHAPE.some(ax=>s.tk[ax])){ const d=ichiOf(o["コース"],kzOf(o["先行勢"],o["逃げの形"])); if(d) o["決まる位置"]=d; }
  else if(!s.tk["決まる位置"]&&tjIchi()){ o["決まる位置"]=tjIchi(); o._tj=true; o._yn="当日の読み"; o._yd=TJ; }
  else if(!s.tk["決まる位置"]&&kzIchi()){ o["決まる位置"]=kzIchi(); o._tj=true; o._yn="前夜の読み"; o._yd=KZ; }
  o._mine=TK_NAMES.filter(ax=>s.tk[ax]); o.kc=s.kc||R.kecchaku; o._kcMine=!!s.kc; return o; }
function tkLine(Y){ const sub=[Y["コース"]?Y["コース"]+"コース":"",Y["先行勢"]?"先行勢"+Y["先行勢"]:"",Y["逃げの形"]?(Y["逃げの形"]==="不在"?"逃げ馬なし":"逃げ"+Y["逃げの形"]):""].filter(Boolean);
  return tkl(Y["決まる位置"]||"—")+(sub.length?`（${sub.join("・")}）`:""); }
function yomiFacts(h){
  const Y=curYomi(), R=(h.runs||[]).filter(r=>!r.kind&&r.fin!=null&&!isNaN(+r.fin)), out=[];
  const HP=((((PACK.flow||{}).horses||{}).by||{})[h.num]||{}).hashiri;
  if(!R.length) return ["近走なし（初出走など）＝脚質未判定"];
  if(HP){ out.push(`脚質：${HP.type}（${HP.say}・近${HP.n}走${HP.lead?`・ハナ${HP.lead}回`:""}）`);
    const pc0=Y["ペース"]; if(pc0&&pc0!=="ミドル"){ const P0=R.filter(r=>r.pace===pc0); out.push(P0.length?`ペースが${pc0}だった近走の着順：${P0.map(r=>r.fin).join("・")}`:`ペースが${pc0}だった近走は無い`); }
    const same0=R.filter(r=>r.venue===PACK.venue&&PACK.course&&String(PACK.course).indexOf(r.sur+r.dist)===0);
    if(same0.length) out.push(`同じコースの着順：${same0.map(r=>r.fin).join("・")}`);
    return out; }
  const pos=R.map(r=>{ const c=String(r.corners||"").match(/\d+/g); return c&&r.heads?(+c[c.length-1])/r.heads:null; });
  const front=pos.filter(x=>x!=null&&x<=0.34).length, back=pos.filter(x=>x!=null&&x>0.5).length, known=pos.filter(x=>x!=null).length;
  const ichi=Y["決まる位置"];
  if(known){
    if(ichi==="前残り"||ichi==="好位"){ const ok=R.filter((r,i)=>pos[i]!=null&&pos[i]<=0.34&&+r.fin<=2).length;
      out.push(`4コーナーで前3分の1：${front}回／${known}走${front?`（うち2着内${ok}回）`:""}`); }
    else { const ok=R.filter((r,i)=>pos[i]!=null&&pos[i]>0.5&&+r.fin<=3).length, ag=R.map(r=>+r.agari).filter(x=>x>0);
      out.push((back?`4コーナーで中団より後ろから3着内：${ok}回／${back}走`:`近${known}走は4コーナーで中団より前（後ろからの競馬は無い）`)+(ag.length?`・上がりの最速 ${Math.min(...ag).toFixed(1)}`:"")); }
  }
  const pc=Y["ペース"]; if(pc&&pc!=="ミドル"){ const P=R.filter(r=>r.pace===pc);
    out.push(P.length?`ペースが${pc}だった近走の着順：${P.map(r=>r.fin).join("・")}`:`ペースが${pc}だった近走は無い`); }
  const same=R.filter(r=>r.venue===PACK.venue&&PACK.course&&String(PACK.course).indexOf(r.sur+r.dist)===0);
  if(same.length) out.push(`同じコースの着順：${same.map(r=>r.fin).join("・")}`);
  return out;
}

  const b=(((PACK.flow||{}).horses||{}).by||{})[n]||{};
  const t=[...(b.tags||[])].sort((x,y)=>Math.abs(y.w||0)-Math.abs(x.w||0)||Math.abs((y.ratio||1)-1)-Math.abs((x.ratio||1)-1));
  const key=x=>Math.abs(x.fw||x.w||0);
  t.sort((x,y)=>key(y)-key(x));
  return t.slice(0,max||3).map(x=>`<span class="tag ${x.info?"":(x.d>0?"cool":"hot")}">${esc(x.t)}${x.fw?` <span class="n">${(+x.ratio).toFixed(2)}</span>倍`:""}</span>`).join("");
}

/* 対戦：出走馬同士が過去に同じレースを走った記録（1対1の比較）と、戦ってきた相手の水準の置き場。
   配信物に rel（V7の相対評価）が入っていればそれを使う。無い間は、各馬の近5走（runs）を突き合わせて作る。
   同じレースの判定＝日付・場・芝ダ・距離・馬場・レース名・頭数がすべて同じ。同じ着順の馬が2頭いる組は出さない。
   ★レース名が「3歳上」「未勝利」などの条件名だけの組は、同日同条件の別レースが混ざる（手元のカード直近600鞍で
     1,654組中49組＝約3%。名前のあるレースは1,303組で0）。runs には勝ち時計が無く見分けられないので、
     unsure として勝ち負けの数には入れず、別の欄に分けて出す。rel が来れば全部が確かな組になる。 */
const REL_GENERIC=/^(?:\d歳上?|未勝利|新馬)?$/;
function relOf(){
  if(PACK._rel) return PACK._rel;
  let races=[];
  if(PACK.rel&&Array.isArray(PACK.rel.h2h)) races=PACK.rel.h2h.map(x=>({...x,runners:[...(x.runners||[])]}));
  else{ const m=new Map();
    (PACK.horses||[]).forEach(h=>(h.runs||[]).forEach(r=>{ if(r.kind||r.fin==null||isNaN(+r.fin)||!r.date) return;
      const k=[r.date,r.venue,r.sur,r.dist,r.going,r.cls,r.heads].join("|");
      if(!m.has(k)) m.set(k,{date:r.date,venue:r.venue,sur:r.sur,dist:r.dist,going:r.going,cls:r.cls,heads:r.heads,unsure:REL_GENERIC.test(String(r.cls||"")),runners:[]});
      m.get(k).runners.push({num:h.num,fin:+r.fin,margin:r.margin,pop:r.pop}); }));
    races=[...m.values()].filter(x=>x.runners.length>=2&&new Set(x.runners.map(y=>y.fin)).size===x.runners.length);
  }
  races.forEach(x=>x.runners.sort((p,q)=>p.fin-q.fin));
  races.sort((p,q)=>String(q.date).localeCompare(String(p.date)));
  const pair={}, by={}, B=n=>by[n]||(by[n]={w:0,l:0,n:0,opp:new Set()});
  races.filter(x=>!x.unsure).forEach(x=>{ x.runners.forEach(r=>{ B(r.num).n++; });
    for(let i=0;i<x.runners.length;i++) for(let k=i+1;k<x.runners.length;k++){ const w=x.runners[i].num, l=x.runners[k].num;
      (pair[w+"-"+l]=pair[w+"-"+l]||{w:0,l:0}).w++; (pair[l+"-"+w]=pair[l+"-"+w]||{w:0,l:0}).l++;
      B(w).w++; B(l).l++; B(w).opp.add(l); B(l).opp.add(w); } });
  return PACK._rel={races,pair,by,fromRel:!!(PACK.rel&&PACK.rel.h2h),lv:(PACK.rel||{}).by||null};
}
/* 近走の行に添えるペースと水準（V7.1.0・p2 の runs の fl／pace／lv。素＝01_model/past_ctx.json）。情報だけ */

    <div class="sec gut">同じレースを走った記録 <span>新しい順・着順の順</span></div><div class="sheetp gut">${sure.map(blk).join("")}</div>`);
    if(L.length<=12) h.push(`<div class="sec gut">1対1の表 <span>行の馬から見た 先着−先着された</span></div><div class="gut" style="overflow-x:auto"><table class="mx"><tr><th></th>${L.map(n=>`<th>${wk(n,PACK.heads,true,HN(n).waku)}</th>`).join("")}</tr>
      ${L.map(a=>`<tr><th>${wk(a,PACK.heads,true,HN(a).waku)}</th>${L.map(b=>{ if(a===b) return `<td class="dg"></td>`; const p=R.pair[a+"-"+b];
        return p?`<td class="n ${p.w>p.l?"up":p.w<p.l?"dn":""}">${p.w}-${p.l}</td>`:`<td></td>`; }).join("")}</tr>`).join("")}</table></div>`); }
  if(uns.length) h.push(`<div class="sec gut">同じ日・同じ条件のレース <span>同じレースかは未確認・<span class="n">${uns.length}</span>組</span></div><div class="sheetp gut">${uns.map(blk).join("")}</div>
    <div class="note gut">※レース名が条件名だけ（未勝利・3歳上など）の組。同じ日に同じ条件のレースが2つあると混ざる（約3%）ので、上の勝ち負けには数えていない。</div>`);
  h.push(`<div class="gut">${slot}<div class="note">${R.fromRel?"":"各馬の近5走を突き合わせた記録（6走以上前の対戦は入らない）。"}着差は勝ち馬との秒差（勝った時は2着との差）。着順だけの比較で、馬場・距離・斤量の違いは見ていない。緑の線＝残す馬。振り分けには使っていない。</div></div>`);
  return h.join("");
}

/* ---------- 馬カード ---------- */
function openCard(num){
  const h=HN(num); if(!h.num) return;
  UI.card=num; drawCard(); $("ov").hidden=false;
  try{history.pushState({v:"card"},"");}catch(e){}
}
function drawCard(){
  const num=UI.card, h=HN(num), t=(((PACK.ai||{}).table)||[]).find(x=>+x.num===+num)||{}, j=jkOf(h), G=groups(), g=G?G.g[num]:null;
  const p=pickOf(), mk=(p&&p.marks||[]).find(m=>+m.num===+num), mcls=m=>m==="◎"?"m2":m==="○"?"m1":"";
  $("ov").innerHTML=`<div class="card" role="dialog" aria-label="${esc(h.name)}">
    <div class="hd gut">${wk(h.num,PACK.heads,false,h.waku)}<h2>${esc(h.name)}</h2>
      <div class="sub">${esc(h.sexage||"")}${h.sire?"・父 "+esc(h.sire):""}／${esc(j.name)}${j.kae?"（乗り替わり）":""}・${esc(h.tr||"")}／斤量 <span class="n">${esc(h.kin??"-")}</span>・馬体重 <span class="n">${esc(h.bataiju||"-")}</span></div></div>
    <div class="body gut">
      <div class="kpi"><div><small>人気・単勝</small><b>${esc(h.pop??"-")}</b><i class="n">${esc(h.odds_cell||h.odds||"-")}</i></div>
        <div><small>HS（3着内）</small><b>${esc(h.hs??"-")}%</b><i>${esc(h.hsr??"-")}位</i></div>
        <div><small>GP（格）</small><b>${esc(h.gp??"-")}</b><i>${esc(h.gpr??"-")}位</i></div>
        <div><small>調教</small><b class="${h.oikiri==="A"?"qa":""}">${esc(h.oikiri||"-")}</b><i>${esc(h.oikiri_note||"")}</i></div></div>
      ${PACK.flow&&tagList(num,8)?`<div class="sec">理由</div><div class="tags">${tagList(num,8)}</div>`:""}
      ${t.marks?`<div class="sec">AI予想の物差し <span>◎○△の順に評価が高い・HSとGPは上の順位と同じなので省略</span></div><div class="mk">${Object.entries(t.marks).filter(([k])=>k!=="実力(HS)"&&k!=="格(GP)").map(([k,m])=>`<div><b class="${mcls(m)}">${esc(m)}</b>${esc(k)}</div>`).join("")}</div>`:""}
      ${(t.why||[]).length||(t.doubt||[]).length?`<div class="note" style="color:var(--ink2)">${(t.why||[]).length?"AIの根拠："+t.why.map(esc).join("・"):""}${(t.doubt||[]).length?"　AIの不安："+t.doubt.map(esc).join("・"):""}</div>`:""}
      <div class="sec">適性</div><dl class="kv">
        <dt>脚質</dt><dd>${esc(h.kyaku||"-")}</dd><dt>上がり3F</dt><dd class="n">${esc(h.agari_cell||"-")}</dd>
        <dt>コース複勝</dt><dd class="n">${esc(h.kofuku||"-")}</dd>
        ${(h.doroba&&h.doroba!=="-")?`<dt>道悪(重)</dt><dd>${esc(h.doroba)}走で3着内</dd>`:""}
        <dt>${esc(h.kyori_label||"当該距離")}の複勝</dt><dd class="n">${esc(h.kyori_now||"-")}</dd>
        <dt>近い距離の複勝</dt><dd class="n">${esc(h.kyofuku||"-")}</dd><dt>持ち時計</dt><dd class="n">${esc(h.jitai||"-")}</dd></dl>
      ${(h.hsr>=8&&h.hsr<=10&&/逃|先/.test(h.kyaku||""))?`<div class="slot" style="border-style:solid"><b>HS8-10位 × 前で運ぶ脚質</b>3着へ飛び込む率が逃げ1.5倍・先行1.4倍（全4841鞍）。機械の相手網（HS2-7位）には入らない位置。</div>`:""}
      <div class="sec">近5走${hanashi(h)?` <span>${kanshoText(h)}・勝ちはすべて0.3秒差以上</span>`:""}</div><div style="overflow-x:auto"><table class="pt"><tr><th>日付</th><th>コース</th><th>着</th><th>人気</th><th>上がり</th><th>通過</th><th>着差</th><th>ペース</th></tr>
        ${(h.runs||[]).filter(r=>!r.kind).map(r=>`<tr><td class="n">${esc(String(r.date||"").slice(2))}<br><span class="cls">${esc(r.cls||"")}</span> ${lvRun(r)}</td>
          <td>${esc(r.venue||"")}${esc(r.sur||"")}<span class="n">${esc(r.dist||"")}</span>${esc(r.going||"")}</td><td class="n"><b class="${+r.fin===1?"up":""}">${esc(r.fin??"-")}</b>${r.heads?"/"+esc(r.heads):""}</td>
          <td class="n">${esc(r.pop??"-")}</td><td class="n">${esc(r.agari??"-")}</td><td class="n">${esc(r.corners||"")}</td><td class="n">${r.margin!=null?(r.margin>0?"+":"")+esc(r.margin):""}</td><td class="pcc">${paceHtml(r).replace("</span> <span","</span><br><span")}</td></tr>`).join("")||`<tr><td colspan="8">出走歴なし</td></tr>`}</table></div>
      ${(h.runs||[]).some(r=>r.pace||r.fl||r.lv)||hanashi(h)?`<div class="note">${hanashi(h)?HNNOTE:""}${PASTNOTE}</div>`:""}
      ${(()=>{ const R=relOf(), mine=R.races.filter(x=>!x.unsure&&x.runners.some(r=>+r.num===+num)), b=R.by[num];
        return `<div class="sec">この鞍の相手と走ったレース <span>${b?`先着 <span class="n">${b.w}</span>・先着された <span class="n">${b.l}</span>`:"近5走には無い"}</span></div>
          ${mine.map(x=>`<div class="h2r"><div class="rh">${relRaceHead(x)}</div>${x.runners.map(r=>{ const y=HN(r.num), me=+r.num===+num;
            return `<div class="ln ${me?"me":""}"><span class="f n">${r.fin}<i>着</i></span>${wk(r.num,PACK.heads,true,y.waku)}<b>${esc(y.name||"")}</b><span class="m n">${r.margin!=null?(r.margin>0?"+":"")+esc(r.margin):""}</span><span class="p n">${r.pop!=null?esc(r.pop)+"人":""}</span></div>`; }).join("")}</div>`).join("")}`; })()}
      ${(()=>{ const v=lvOf(num), n=Object.keys((PACK.rel||{}).by||{}).length; if(!n) return "";
        if(!v) return `<div class="sec">戦ってきた相手の水準</div><div class="note" style="color:var(--ink2)">持ち点なし（新馬・表に無い馬）</div>`;
        return `<div class="sec">戦ってきた相手の水準 <span>情報だけ・HSや振り分けには使っていない</span></div><dl class="kv">
          <dt>持ち点</dt><dd><span class="n">${esc(v.aite_pt)}</span>（<span class="n">${n}</span>頭中 <span class="n">${esc(v.aite_rank)}</span>位・反映 <span class="n">${esc(v.runs)}</span>走）</dd>
          <dt>区分</dt><dd class="${v.band==="上"?"up":v.band==="下"?"dn":""}">${LVLAB[v.band]||"どちらでもない"}${v.band==="上"&&h.pop>=7?`<span class="cls">　7番人気以下では高い馬でも3着内は約10%</span>`:""}</dd></dl>`; })()}
      <div class="sec">注目とメモ <span>ピックした鞍に残る</span></div>
      <textarea class="memo" id="hmemo" rows="2" placeholder="なぜ気になるか">${esc(mk?mk.note:"")}</textarea>
      <button class="cta ghost" style="margin-top:8px" onclick="mark(${h.num})">${mk?"★ 注目を外す":"★ この鞍の注目馬にする"}</button>
    </div>
    <div class="ft gut"><button onclick="history.back()">閉じる</button>
      ${G?`<button class="${g==="cut"?"x":""}" onclick="cardOv(${h.num},'cut')">${g==="cut"?"保留に戻す":"消す"}</button>
      <button class="${g==="keep"?"":"k"}" onclick="cardOv(${h.num},'keep')">${g==="keep"?"保留に戻す":"残す"}</button>`:""}</div></div>`;
}
function closeCard(){ $("ov").hidden=true; UI.card=null; }
function cardOv(n,v){ setOv(n,v); history.back(); }
function mark(num){
  const h=HN(num), p=ensurePick(), i=p.marks.findIndex(m=>+m.num===+num), note=($("hmemo")&&$("hmemo").value||"").trim();
  if(i>=0) p.marks.splice(i,1);
  else p.marks.push({num:h.num,name:h.name,jk:h.jk,heads:PACK.heads,note:note||`HS${h.hsr}位・${h.pop}人気`});
  savePicks(); history.back(); render();
}
$("ov").addEventListener("click",e=>{ if(e.target.id==="ov") history.back(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("ov").hidden) history.back(); });

/* ---------- 下の操作帯（スマホ幅）：ホームは 今日／買い目／前回、鞍は 戻る＋4ステップ（予想以外のタブでは前後の鞍） ---------- */
function drawBar(){
  const B=$("bar");
  if(UI.view==="home"&&!TODAY){ B.innerHTML=""; return; }
  if(UI.view==="home"||!PACK){ B.innerHTML=UI.view==="home"?`<div class="barrow gut">${navItems().map(([k,l,n])=>`<button class="nav ${UI.htab===k?"on":""}" onclick="setH('${k}')">${n?`<b>${n}</b>`:""}${l}</button>`).join("")}</div>`
      :`<div class="barrow gut"><button class="list" style="flex:1" onclick="goBack()">‹ 今日</button></div>`; return; }
  const s=st(), R=TODAY?homeRaces().filter(r=>r.rid):[], pk=isPicked(UI.rid), L=pk?R.filter(r=>isPicked(r.rid)):R, k=L.findIndex(r=>r.rid===UI.rid), pv=L[k-1], nx=L[k+1], lab=pk?"ピック":"鞍";
  B.innerHTML=`<div class="barrow gut"><button class="list" onclick="goBack()">‹ 今日</button>${
    s.tab==="y"&&PACK.flow?STEPS.map((l,n)=>`<button class="stp ${s.step===n?"on":n<s.step?"dn":""}" onclick="setStep(${n})"><i>${n+1}</i>${l}</button>`).join("")
    :`<button class="stp" ${pv?`onclick="openRace('${esc(pv.rid)}')"`:"disabled"}><i>前の${lab}</i>${pv?esc(pv.place)+"R":"—"}</button><button class="stp" ${nx?`onclick="openRace('${esc(nx.rid)}')"`:"disabled"}><i>次の${lab}</i>${nx?esc(nx.place)+"R":"—"}</button>`}</div>`;
}

/* ---------- 画面の切り替え ---------- */
function render(){
  const pc=isPC();
  $("paneL").hidden=!pc&&UI.view!=="home"; $("paneR").hidden=!pc&&UI.view!=="race";
  drawLeft(); drawRight(); drawBar();
}
function setH(k){ UI.htab=k; if(!isPC()) window.scrollTo(0,0); else $("paneL").scrollTop=0; drawLeft(); drawBar(); }
function setF(k){ const i=UI.flts.indexOf(k); if(i>=0) UI.flts.splice(i,1); else UI.flts.push(k); drawLeft(); }
/* 戻るジェスチャー：画面の切り替えを履歴に積み、戻り先は今の画面の状態だけで決める */
addEventListener("popstate",()=>{
  if(!$("ov").hidden){ closeCard(); return; }
  if(!isPC()){ UI.view="home"; render(); window.scrollTo(0,0); }
});
function pcAutoOpen(){ if(!isPC()||UI.rid||!TODAY) return; const R=homeRaces().filter(r=>r.rid); if(!R.length) return;
  const nx=R.find(r=>{const m=minsTo(r.time);return m!==null&&m>=0;})||R[R.length-1]; openRace(nx.rid); }
let _pc=isPC(), _pc3=isPC3();
addEventListener("resize",()=>{ const a=isPC(), b=isPC3(); if(a===_pc&&b===_pc3) return; _pc=a; _pc3=b;
  if(a&&!UI.rid) pcAutoOpen(); else { if(!a&&UI.view==="race"&&!UI.rid) UI.view="home"; render(); } });

async function boot(){
  try{
    TODAY=JSON.parse(await fetchDoc("00_published/TODAY.json"));
    try{IDX=JSON.parse(await fetchDoc("00_published/p2/index.json"));}catch(e){IDX={races:[]};}
    render(); pcAutoOpen();
  }catch(e){ if(e.message==="NOSETUP") UI.setup=true; else UI.homeErr=e.message; render(); }
}
/* 更新：配信は毎時。押した時だけ取り直す（自動では取りに行かない＝通信を増やさない）。配信の刻みも突き合わせる */
async function reloadData(b){
  if(!b||b.disabled) return;
  const label=b.textContent; b.disabled=true; b.textContent="更新中"; let msg="最新";
  try{
    TODAY=JSON.parse(await fetchDoc("00_published/TODAY.json",true));
    try{ IDX=JSON.parse(await fetchDoc("00_published/p2/index.json",true)); }catch(e){}
    if(UI.rid&&PACK&&(isPC()||UI.view==="race")) await openRace(UI.rid,true); else render();
    const dv=await deployedBuild();
    if(dv&&dv!==BUILD){
      let tried=null; try{tried=sessionStorage.getItem(LS_RELOADED);}catch(e){}
      if(tried!==dv){ try{sessionStorage.setItem(LS_RELOADED,dv);}catch(e){} location.replace(location.pathname+"?v="+encodeURIComponent(dv)); return; }
      msg="要再読込";
    }
  }catch(e){ msg="失敗"; if(!TODAY){ UI.homeErr=e.message; render(); } }
  const nb=(b.isConnected?b:$("rfsh"))||b; nb.textContent=msg; nb.disabled=true;
  setTimeout(()=>{ const x=nb.isConnected?nb:$("rfsh"); if(x){ x.textContent=label; x.disabled=false; } },1500);
}
function saveSetup(){ lsSet(LS.repo,$("repo").value.trim()); lsSet(LS.token,$("token").value.trim()); location.reload(); }
/* 残り時間は1分ごとに描き直す（時刻表と、鞍の見出しの残り時間だけ。入力中の画面は描き直さない） */
setInterval(()=>{ if(!TODAY) return; if(isPC()||UI.view==="home"){ if(UI.htab==="today"&&!document.querySelector("#paneL input:focus")) { const y=$("paneL").scrollTop; drawLeft(); $("paneL").scrollTop=y; } }
  if(PACK&&$("rcd")){ const [t,c]=cdText(PACK.post_time); $("rcd").textContent=t; $("rcd").className="cd "+c; } }, 60000);
boot();
</script>
